[project]
name = "modal-local-llm-app"
version = "0.1.0"
description = "A Modal-hosted Gradio chat UI serving an open-weight LLM via vLLM, behind a shared passcode."
requires-python = ">=3.12"
dependencies = [
    "modal>=0.66",
    "gradio>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src", "app.py"]
