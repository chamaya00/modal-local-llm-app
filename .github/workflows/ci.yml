name: ci

# Thin caller: the logic lives in the factory, at the release pinned below.
#
# The pin is the point. This repository keeps running that exact release until
# somebody bumps the line and merges it - a new release in the factory changes
# nothing here on its own. `/update-agents` proposes the bump as a pull
# request, so the diff gets read here before it runs here.
#
# ---------------------------------------------------------------------------
# This is the project's real gate, replacing the provisioning placeholder now
# that the Python toolchain has landed (issue #4 / PR #7). The project has no
# Node package.json, so this stays on the commands path rather than switching
# to the reusable workflow's Node path - a project with no package manager
# keeps `commands` and swaps in its own real checks rather than moving to
# `node-version`/`checks`.
#
# Pushed to `main` directly rather than onto PR #7's branch: project-guard's
# protected-path check binds to the pull request's original author (the
# engineer bot), not whoever pushes a later commit, and this repo's guard.yml
# sets no `maintainers` either - so a human's fix pushed onto that PR would be
# blocked no matter what. Landing it on `main` and then merging `main` into
# the PR branch is what a reader should expect to see next: once merged, the
# PR's diff-from-base no longer touches this file, so guard's check passes.
#
# `main` will show `ci / checks` failing until PR #7 merges - `uv sync` has
# nothing to sync without a `pyproject.toml`, and this repo doesn't have one
# until that PR lands. That's expected, not a bug in this commit.
#
# If a check here is ever renamed, rename it in the same commit and re-point
# the branch protection rule in the same sitting - the job name is the string
# protection matches on, so a renamed check that no longer reports blocks
# every merge instead of gating them.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: chamaya00/agent-factory/.github/workflows/ci.yml@v1.36.0
    with:
      check-name: 'checks'
      commands: |
        curl -LsSf https://astral.sh/uv/install.sh | sh && sudo install -m 755 ~/.local/bin/uv /usr/local/bin/uv && sudo install -m 755 ~/.local/bin/uvx /usr/local/bin/uvx
        uv sync
        uv run ruff check .
        uv run mypy .
        uv run pytest
