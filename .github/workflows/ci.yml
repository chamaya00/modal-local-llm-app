name: ci

# Thin caller: the logic lives in the factory, at the release pinned below.
#
# The pin is the point. This repository keeps running that exact release until
# somebody bumps the line and merges it - a new release in the factory changes
# nothing here on its own. `/update-agents` proposes the bump as a pull
# request, so the diff gets read here before it runs here.
#
# ---------------------------------------------------------------------------
# This is the project's real gate, replacing the provisioning placeholder now
# that the Python toolchain has landed (issue #4 / PR #7). The project has no
# Node package.json, so this stays on the commands path rather than switching
# to the reusable workflow's Node path - per the note the placeholder used to
# carry here, a project with no package manager keeps `commands` and swaps in
# its own real checks rather than moving to `node-version`/`checks`.
#
# If a check here is ever renamed, rename it in the same commit and re-point
# the branch protection rule in the same sitting - the job name is the string
# protection matches on, so a renamed check that no longer reports blocks
# every merge instead of gating them.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: chamaya00/agent-factory/.github/workflows/ci.yml@v1.26.0
    with:
      check-name: 'checks'
      commands: |
        uv sync
        uv run ruff check .
        uv run mypy .
        uv run pytest
